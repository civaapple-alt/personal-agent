name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unix:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22.19.0", "26"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build server and web UI
        run: npm run build

      - name: Run offline test suite
        run: npm test

      - name: Verify isolated server startup and graceful shutdown
        run: npm run check:startup

      - name: Verify documentation links, anchors, and commands
        run: npm run check:docs

      - name: Run open-source and history hygiene audit
        run: npm run check:opensource -- --history --public

      - name: Verify clean release preview archive
        run: npm run package:release -- --preview

  windows-smoke:
    name: Build & Startup Smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and typecheck
        run: npm run check

      - name: Build server and web UI
        run: npm run build

      - name: Verify isolated server startup and graceful IPC shutdown
        run: npm run check:startup

      - name: Verify documentation links, anchors, and commands
        run: npm run check:docs

      - name: Verify open-source snapshot metadata
        run: npm run check:opensource

      - name: Verify clean release preview archive
        run: npm run package:release -- --preview
